name: Desktop tool CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v4.8.0)
        required: true
        default: v4.8.0
      title:
        description: Release title
        required: false
        default: Release 4.8.0

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    #          - os: ubuntu-latest  # https://github.com/browser-actions/setup-edge/issues/516
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-desktop-tool
        with:
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          moxfield-secret: ${{ secrets.MOXFIELD_SECRET }}
  build:
    name: Build
    needs: [test]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-tool
    strategy:
      matrix:
        include:
          - os: macos-latest
            FILENAME: autofill-macos-arm.command
            TARGET: macos-arm
            MACOS_ARCH: arm64
          - os: macos-15
            TARGET: macos-intel
            FILENAME: autofill-macos-intel.command
            MACOS_ARCH: x86_64
          - os: windows-latest
            FILENAME: autofill-windows.exe
            TARGET: windows
            MACOS_ARCH: ""
          - os: ubuntu-latest
            FILENAME: autofill-linux.bin
            TARGET: linux
            MACOS_ARCH: ""
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      # setup macOS runners for signing and notarisation
      # retrieved from https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications#add-a-step-to-your-workflow
      - name: Install the Apple certificate and notarisation profile
        if: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
        continue-on-error: true
        env:
          MACOS_SIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGN_CERTIFICATE_BASE64 }}
          MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          NOTARY_KEY_PATH=$RUNNER_TEMP/build_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$MACOS_SIGN_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$MACOS_NOTARY_KEY_BASE64" | base64 --decode -o $NOTARY_KEY_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$MACOS_SIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # create notarisation profile
          xcrun notarytool store-credentials "${{ secrets.MACOS_NOTARY_PROFILE_NAME }}" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "${{ secrets.MACOS_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.MACOS_NOTARY_ISSUER_ID }}" \
            --keychain $KEYCHAIN_PATH

      # install dependencies and build
      - name: Install dependencies - non-macOS
        if: ${{ !((matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel')) }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install dependencies - macOS
        if: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
        run: |
          arch -${{ matrix.MACOS_ARCH }} python -m pip install --upgrade pip
          arch -${{ matrix.MACOS_ARCH }} pip install -r requirements.txt
      - name: Install imageio for Nutika .ico conversion
        run: |
          python -m pip install imageio
      - name: Write Google Drive API credentials to file
        uses: jsdaniell/create-json@v1.2.3
        continue-on-error: true
        with:
          name: "client_secrets.json"
          json: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          dir: "desktop-tool/"
      - name: Ensure client_secrets.json exists
        working-directory: desktop-tool
        run: |
          if [ ! -s client_secrets.json ]; then
            printf '%s\n' '{"type":"service_account","project_id":"placeholder"}' > client_secrets.json
          fi
      - name: Build with Nuitka for ${{ matrix.TARGET }}
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: desktop-tool
          script-name: autofill.py
          mode: onefile
          output-file: ${{ matrix.FILENAME }}
          macos-sign-notarization: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
          macos-sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
          macos-sign-keyring-filename: "${{ runner.temp }}/app-signing.keychain-db"
          macos-sign-keyring-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          macos-signed-app-name: com.ndepaola.mpc-autofill-${{ matrix.TARGET }}
          macos-target-arch: ${{ matrix.MACOS_ARCH }}
      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.TARGET }} Unsigned Build
          path: |
            desktop-tool/build/${{ matrix.FILENAME }}

      # notarise macOS executables
      - name: Notarise macOS executable
        id: submit-notarisation-request
        if: ${{ (matrix.TARGET == 'macos-arm') || (matrix.TARGET == 'macos-intel') }}
        continue-on-error: true
        run: |
          # create a zip archive suitable for notarization
          /usr/bin/ditto -c -k "build/${{ matrix.FILENAME }}" "build/compressed.zip"

          # invoke notarytool
          xcrun notarytool submit "build/compressed.zip" --keychain-profile ${{ secrets.MACOS_NOTARY_PROFILE_NAME }} --wait

      # sign Windows executables with SignPath
      - name: Sign Windows executable with SignPath
        if: ${{ matrix.TARGET == 'windows' }}
        id: submit-signing-request
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "061f342a-ba1a-404b-b7f8-e08c8f6d9792"
          project-slug: "mpc-autofill"
          signing-policy-slug: "release-signing"
          github-artifact-id: "${{ steps.upload-unsigned-artifact.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: desktop-tool/build/
      - name: Upload signed artifact to GitHub
        if: ${{ matrix.TARGET == 'windows' }}
        id: upload-signed-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.TARGET }} Signed Build
          path: |
            desktop-tool/build/${{ matrix.FILENAME }}

  release:
    name: GitHub Release
    needs: [build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Package release zips
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -print || true
          package() {
            local zip_name="$1"
            local binary_name="$2"
            local file
            file="$(find artifacts -type f -name "$binary_name" | head -n 1 || true)"
            if [ -z "$file" ]; then
              echo "Skipping $zip_name; $binary_name was not built."
              return 0
            fi
            mkdir -p "staging/$zip_name"
            cp "$file" "staging/$zip_name/$binary_name"
            (cd "staging/$zip_name" && zip "../../dist/${zip_name}.zip" "$binary_name")
          }
          package autofill-linux autofill-linux.bin
          package autofill-windows autofill-windows.exe
          package autofill-macos-arm autofill-macos-arm.command
          package autofill-macos-intel autofill-macos-intel.command
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title || inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          make_latest: true
